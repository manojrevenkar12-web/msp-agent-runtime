name: deps
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew resolveAll --no-daemon
      - run: tar -C .gradle-home -czf gradle-cache.tgz caches/modules-2
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gradle-cache --yes --cleanup-tag || true
          gh release create gradle-cache gradle-cache.tgz --title "gradle cache (temporary)" --notes "Dependency cache for offline builds. Deleted after use." --prerelease
