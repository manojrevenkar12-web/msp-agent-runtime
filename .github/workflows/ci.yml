name: ci
on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test every module (service tests that need a database run in the integration job)
        run: ./gradlew build --no-daemon
      - name: The held-out run refuses to run a second time
        run: |
          ./gradlew :eval:heldout --no-daemon -q 2>&1 | grep -q "already run"
      - name: The report, the README and the console's demo data agree with the code
        run: |
          ./gradlew :eval:evaluate :eval:readme :eval:demo --no-daemon -q
          git diff --exit-code reports/dev.json README.md console/public/demo.json

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: msp
          POSTGRES_PASSWORD: msp
          POSTGRES_DB: msp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msp" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      MSP_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/msp
      MSP_TEST_DATABASE_USER: msp
      MSP_TEST_DATABASE_PASSWORD: msp
      MSP_TEST_RABBIT_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Service tests on PostgreSQL with pgvector and RabbitMQ
        run: ./gradlew :service:test --no-daemon
      - name: The jar takes a signed webhook and the agents run behind RabbitMQ
        run: |
          ./gradlew :service:bootJar --no-daemon -q
          DATABASE_URL=$MSP_TEST_DATABASE_URL DATABASE_USER=msp DATABASE_PASSWORD=msp MSP_BUS=amqp \
            MSP_RABBIT_HEALTH=true PORT=8790 java -jar service/build/libs/msp-agent-runtime.jar > app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8790/actuator/health/readiness && break; sleep 2; done
          python3 scripts/smoke.py http://localhost:8790
      - if: failure()
        run: tail -n 200 app.log || true

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The container image builds
        run: docker build -t msp-agent-runtime .
